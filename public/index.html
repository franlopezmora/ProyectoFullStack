<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Starbucks Locales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="text-center mb-4">Listado de Locales Starbucks</h1>
  
    <div class="d-flex flex-wrap gap-2 mb-3">
      <input id="filtro-texto" class="form-control" placeholder="Buscar por nombre" style="max-width: 250px;" />
      <select id="filtro-hemisferio" class="form-select" style="max-width: 200px;">
        <option>Todos</option>
        <option>Norte Este</option>
        <option>Norte Oeste</option>
        <option>Sur Este</option>
        <option>Sur Oeste</option>
      </select>
      <button id="btn-filtrar" class="btn btn-primary">Filtrar</button>
    </div>
  
    <table class="table table-striped table-bordered" id="tabla-locales">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Ciudad</th>
          <th>País</th>
          <th>Semi Hemisferio</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
